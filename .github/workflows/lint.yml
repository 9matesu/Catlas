name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint example diagrams
        run: python scripts/mermaid-lint.py examples/opcoda-pe-pipeline/diagrams
